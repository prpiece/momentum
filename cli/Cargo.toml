[package]
name = "momentum-cli"
version = "1.1.3"
description = "The momentum command line and MCP server for the Momentum planner (D264)"
edition = "2024"

[[bin]]
name = "momentum-cli"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
