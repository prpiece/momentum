[package]
name = "momentum"
version = "1.0.2"
description = "Momentum, an offline desktop planner"
authors = ["Momentum contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "momentum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
tauri-plugin-notification = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
# Voice quick-add (D81): Parakeet via sherpa-onnx (static libs), mic capture, model download + check.
sherpa-onnx = "2.0.1"
cpal = "0.18"
reqwest = { version = "0.13", default-features = false }
sha2 = "0.10"
tar = "0.4"
bzip2 = "0.6"
# Refresh token in the OS keychain (v1.1, D225).
keyring = "4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
