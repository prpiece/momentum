# Builds installers for Windows, macOS and Linux and attaches them to ONE draft GitHub Release
# whenever a version tag (v1.2.3) is pushed. See README → "Cutting a release".
# The draft is created once up front: GitHub's release-by-tag lookup ignores drafts, so parallel
# build jobs creating their own would split the assets across duplicate drafts (v0.7.0 did).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Creates the single draft every build job uploads to.
  release:
    needs: test
    permissions:
      contents: write # creates/updates the draft release
    # A manual run from a branch would draft a release tagged with the branch name (RUST-13).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The tag's section of CHANGELOG.md tops the release notes; the app's "What's new" shows it (PLAN D66).
      # Screenshots point at public/whats-new/ in the app; on GitHub they load from the tagged source.
      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/public/"
          notes=$(awk -v tag="## ${GITHUB_REF_NAME}" '$0 == tag { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md | sed "s#](whats-new/#](${raw}whats-new/#")
          # The app matches the heading exactly (changelogSection), so a suffixed heading would show nothing there too.
          grep -q "[^[:space:]]" <<<"$notes" || { echo "::error::no CHANGELOG section for ${GITHUB_REF_NAME}: add an exact \"## ${GITHUB_REF_NAME}\" heading with content"; exit 1; }
          {
            echo "body<<NOTES_EOF"
            echo "$notes"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create the draft release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.notes.outputs.body }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat > body.md <<'BODY_EOF'
          $NOTES_PLACEHOLDER

          ---

          ### Install

          Already have Momentum? It updates itself: you'll be asked when you next open it.

          | Platform | Download |
          |---|---|
          | **Windows** | `Momentum___VERSION___x64-setup.exe` (or the `.msi`) |
          | **macOS, Apple Silicon** | `Momentum___VERSION___aarch64.dmg` |
          | **macOS, Intel** | `Momentum___VERSION___x64.dmg` |
          | **Linux** | `.AppImage`, `.deb` or `.rpm` |

          The installers aren't code-signed yet. On Windows, if SmartScreen says "Windows protected your PC", click **More info → Run anyway**. On macOS the app isn't notarized yet, so the first launch says Apple can't verify it: open it once and click **Done**, then go to **System Settings → Privacy & Security** and click **Open Anyway** next to Momentum. If there's no such button, run `xattr -dr com.apple.quarantine /Applications/Momentum.app` in Terminal and open it again. Updates from inside the app skip this.
          BODY_EOF
          python3 - "$version" <<'PY'
          import os, sys
          body = open("body.md").read().replace("$NOTES_PLACEHOLDER", os.environ["NOTES"]).replace("__VERSION__", sys.argv[1])
          open("body.md", "w").write(body)
          PY
          # Re-runs reuse this tag's draft. A new draft's id comes from the create response itself:
          # the release list lags behind a just-created draft, so looking it up there can come back empty.
          id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq ".[] | select(.draft and .tag_name==\"$GITHUB_REF_NAME\") | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/$id" -F body=@body.md --silent
          else
            id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" -f tag_name="$GITHUB_REF_NAME" -f name="Momentum $GITHUB_REF_NAME" -F draft=true -F body=@body.md --jq .id)
          fi
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    permissions:
      contents: write # tauri-action uploads assets and latest.json to the draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "./src-tauri -> target"
          # sherpa-onnx-sys downloads its library here, outside what rust-cache keeps; without it a
          # restored build-script output points at a missing library ("could not find sherpa-onnx-c-api").
          cache-directories: src-tauri/target/sherpa-onnx-prebuilt
          prefix-key: v1-rust

      # --ignore-scripts: dependency install scripts never run here, and the signing key is not in this step's env.
      - run: npm ci --ignore-scripts

      # RUST-13: everything that runs third-party code (vite, build scripts, the CLI build) runs here,
      # without the signing key. The signing step below only bundles: cargo finds the build up to date
      # and tauri.bundle-only.conf.json drops beforeBuildCommand, so the frontend isn't rebuilt.
      # The compile uses the same --config as the signing step: tauri-build re-runs when TAURI_CONFIG
      # changes, which would otherwise recompile (and run build scripts) with the key in the environment.
      # beforeBuildCommand is run by hand here, since the shared config drops it.
      - name: Compile (no signing key)
        shell: bash
        run: |
          # tauri sets TAURI_ENV_TARGET_TRIPLE for beforeBuildCommand; run by hand, the CLI needs the matrix target too.
          TAURI_ENV_TARGET_TRIPLE=$(sed -n 's/.*--target \([^ ]*\).*/\1/p' <<<"${{ matrix.args }}") node scripts/build-cli.mjs --release
          npm run build
          npx tauri build --no-bundle --config src-tauri/tauri.bundle-only.conf.json ${{ matrix.args }}

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater bundles; tauri-action then merges this platform into latest.json (PLAN D59).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.release.outputs.id }}
          args: --config src-tauri/tauri.bundle-only.conf.json ${{ matrix.args }}

  # Parallel jobs merge latest.json one after another; a simultaneous finish could drop a platform.
  # ponytail: detect it instead of serialising the builds; re-run the failed job if this ever trips.
  verify:
    needs: [release, build]
    permissions:
      contents: write # lists the draft release's assets (drafts are hidden from read-only tokens)
    runs-on: ubuntu-22.04
    steps:
      - name: latest.json lists every platform
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${{ needs.release.outputs.id }}/assets" --jq '.[] | select(.name=="latest.json") | .id')
          test -n "$id" || { echo "latest.json missing"; exit 1; }
          gh api -H "Accept: application/octet-stream" "repos/${GITHUB_REPOSITORY}/releases/assets/$id" > latest.json
          for p in windows-x86_64 darwin-aarch64 darwin-x86_64 linux-x86_64; do
            jq -e --arg p "$p" '.platforms[$p].url and .platforms[$p].signature' latest.json > /dev/null || { echo "latest.json lacks $p"; exit 1; }
          done
          echo "latest.json covers all platforms"
