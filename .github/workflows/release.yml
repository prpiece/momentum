# Builds installers for Windows (first), macOS and Linux and attaches them to a draft
# GitHub Release whenever a version tag (v1.2.3) is pushed. See README → "Cutting a release".
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      # The tag's section of CHANGELOG.md tops the release notes; the app's "What's new" shows it (PLAN D66).
      # Screenshots point at public/whats-new/ in the app; on GitHub they load from the tagged source.
      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/public/"
          notes=$(awk -v tag="## ${GITHUB_REF_NAME}" '$0 == tag { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md | sed "s#](whats-new/#](${raw}whats-new/#")
          {
            echo "body<<NOTES_EOF"
            echo "$notes"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater bundles; tauri-action then attaches latest.json for in-app updates (PLAN D59).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Momentum ${{ github.ref_name }}"
          releaseBody: |
            ${{ steps.notes.outputs.body }}

            ---

            ### Install

            Already have Momentum? It updates itself: you'll be asked when you next open it.

            | Platform | Download |
            |---|---|
            | **Windows** | `Momentum___VERSION___x64-setup.exe` (or the `.msi`) |
            | **macOS, Apple Silicon** | `Momentum___VERSION___aarch64.dmg` |
            | **macOS, Intel** | `Momentum___VERSION___x64.dmg` |
            | **Linux** | `.AppImage`, `.deb` or `.rpm` |

            The installers aren't code-signed yet. On Windows, if SmartScreen says "Windows protected your PC", click **More info → Run anyway**. On macOS, right-click the app and choose **Open** the first time.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
