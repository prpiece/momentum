name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Selector lint + Vitest (domain logic, DST/time-zone cases, row parsing, store logic)
      - run: npm test
      # TypeScript typecheck + production frontend build
      - run: npm run build
